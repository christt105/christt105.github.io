# Change baseurl before deploy
baseurl = "https://christt105.github.io/"
languageCode = "en-us"
title = "Christian Martínez De La Rosa"
timeZone = "Europe/Madrid"

# Theme i18n support
# See all available values at https://github.com/CaiJimmy/hugo-theme-stack/tree/master/i18n
defaultContentLanguage = "en"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = false

[pagination]
pagerSize = 5

# CI runners are slower than local hardware; the default 60s per-page render
# timeout can be too tight once a page has several remote fetches (GitHub API
# cards, external images) or large images to process.
timeout = "300s"
